# Publishes the artifact to GitHub Packages when a release is created.
# Action versions and the JDK are kept in step with ci.yml, so a release builds exactly the way
# the gate that approved it did.
name: Maven GitHub Publish

on:
  release:
    types: [created]

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          server-id: github # matches distributionManagement/repository/id in pom.xml
          settings-path: ${{ github.workspace }}

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
